<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | IT-MEMO</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            itmemoPrimary: '#10b981',
            itmemoPrimaryHover: '#059669',
            itmemoBg: '#ffffff',
            itmemoSurface: '#f8fafc',
            itmemoTextMain: '#0f172a',
            itmemoTextSub: '#64748b'
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
  <script src="db.js"></script>
</head>
<body class="bg-itmemoSurface text-itmemoTextMain font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 shadow-xl border border-slate-200">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 group mb-2">
        <span class="w-9 h-9 rounded-xl bg-itmemoPrimary/10 border border-itmemoPrimary/30 flex items-center justify-center text-itmemoPrimary font-mono font-bold text-xl">
          ⚡
        </span>
        <span class="font-mono font-bold text-2xl tracking-tight text-itmemoTextMain">
          IT-MEMO
        </span>
      </a>
      <h1 class="text-lg font-bold text-itmemoTextMain mt-2">수강생 회원가입</h1>
      <p class="text-xs text-itmemoTextSub">전자책 평생 보관 및 1:1 질문방 혜택</p>
    </div>

    <form onsubmit="handleRegister(event)" class="space-y-4">
      <div>
        <label for="regName" class="block text-xs font-mono text-slate-500 mb-1">성함 또는 닉네임</label>
        <input type="text" id="regName" required placeholder="홍길동" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-itmemoPrimary focus:ring-1 focus:ring-itmemoPrimary transition-all">
      </div>

      <div>
        <label for="regEmail" class="block text-xs font-mono text-slate-500 mb-1">이메일 주소</label>
        <input type="email" id="regEmail" required placeholder="name@company.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-itmemoPrimary focus:ring-1 focus:ring-itmemoPrimary transition-all">
      </div>

      <div>
        <label for="regPassword" class="block text-xs font-mono text-slate-500 mb-1">비밀번호</label>
        <input type="password" id="regPassword" required placeholder="6자 이상 입력" minlength="6" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-itmemoPrimary focus:ring-1 focus:ring-itmemoPrimary transition-all">
      </div>

      <div class="flex items-center gap-2 pt-1">
        <input type="checkbox" id="agreeTerms" required class="rounded text-itmemoPrimary focus:ring-itmemoPrimary">
        <label for="agreeTerms" class="text-xs text-slate-500">
          [필수] <a href="#" class="text-itmemoPrimary underline">이용약관</a> 및 <a href="#" class="text-itmemoPrimary underline">개인정보처리방침</a> 동의
        </label>
      </div>

      <div id="regError" class="hidden text-xs text-rose-500 font-medium"></div>

      <button type="submit" class="w-full btn-lift flex items-center justify-center gap-2 bg-itmemoPrimary hover:bg-itmemoPrimaryHover text-white font-semibold py-3.5 rounded-xl text-sm transition-all shadow-md shadow-emerald-500/20">
        <span>가입하고 시작하기</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-100 flex items-center justify-between text-xs text-itmemoTextSub">
      <a href="index.html" class="hover:text-itmemoTextMain transition-colors">← 홈으로 이동</a>
      <div>
        <span>이미 계정이 있으신가요?</span>
        <a href="login.html" class="text-itmemoPrimary font-semibold hover:underline ml-1">로그인</a>
      </div>
    </div>
  </div>

  <script>
    if (window.lucide) lucide.createIcons();

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const errorDiv = document.getElementById('regError');

      const result = itmemoDB.register(email, password, name);
      if (result.success) {
        alert('회원가입이 완료되었습니다! 마이페이지로 이동합니다.');
        window.location.href = 'mypage.html';
      } else {
        errorDiv.textContent = result.message;
        errorDiv.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
