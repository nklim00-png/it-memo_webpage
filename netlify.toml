# Netlify Configuration for IT-MEMO Commercial Webpage

[build]
  # 정적 사이트이므로 빌드 명령 없이 루트 디렉토리를 바로 배포합니다.
  publish = "."

# HTTPS 보안 헤더 및 성능 최적화
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 정적 에셋 캐시 최적화
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
